# Render Blueprint: free web service + free Postgres.
# Dashboard → New → Blueprint → pick this repo. Leave ANTHROPIC_API_KEY empty to run the agent in local rules mode.
services:
  - type: web
    name: fixflow
    runtime: node
    plan: free
    region: virginia
    buildCommand: cd frontend && npm ci --include=dev && npm run build && cd ../backend && npm ci --include=dev && npm run build
    startCommand: cd backend && node dist/main.js
    healthCheckPath: /api/agent/status
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: fixflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ON_EMPTY
        value: "true"
      - key: DEMO_RESET_CRON
        value: "0 4 * * *"
      - key: APP_TIMEZONE
        value: America/Toronto
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: ANTHROPIC_API_KEY
        sync: false
databases:
  - name: fixflow-db
    plan: free
    region: virginia
    databaseName: fixflow
    user: fixflow
